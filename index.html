<style>
:root{--bg:#0b0d08;--fg:#fff;--pink:#dfff00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Press Start 2P',monospace,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:min(100vw,calc((100vh - 12px)*2))}
@supports (height:100dvh){#wrap{width:min(100vw,calc((100dvh - 12px)*2))}}
@media (pointer:coarse){#wrap{width:min(100vw,calc((100vh - 90px)*2))}}
#fs,#snd,#pb{position:absolute;right:10px;bottom:10px;z-index:3;width:34px;height:34px;border-radius:6px;border:2px solid #fff;background:rgba(11,13,8,.7);color:#fff;font-size:16px;cursor:pointer}
canvas{box-sizing:border-box;width:100%;display:block;image-rendering:pixelated;border:4px solid #fff;border-radius:6px;background:#7fd6ff}
#menu{position:absolute;left:0;top:0;width:800px;height:400px;transform-origin:0 0;padding:8px;box-sizing:border-box;overflow:hidden;background:#0b0d08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:12px;line-height:1.8}
#menu h1{font-size:26px;margin:0;color:var(--pink)}
#chars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.ch{background:#141a0c;border:2px solid #2c3a14;border-radius:6px;padding:4px 4px 6px;cursor:pointer;color:#fff;font:inherit;font-size:8px;transition:transform .12s,border-color .12s}
.ch:hover{transform:translateY(-3px);border-color:#8fb300}
.ch.sel{border-color:#dfff00;background:#1f2a0e;box-shadow:0 0 12px rgba(223,255,0,.45)}
.ch canvas{width:60px;height:auto;border:0;background:none}
#go{background:#dfff00;color:#0b0d08;border:0;border-radius:6px;padding:12px 28px;font:inherit;font-size:inherit;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 18px rgba(223,255,0,.7)}}
@media (prefers-reduced-motion:reduce){#go{animation:none}}
#mbg{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;background:none;z-index:0}
#menu>*:not(#mbg){position:relative;z-index:1}
#brand{display:flex;align-items:center;gap:12px;text-align:left}
#logo{width:64px;height:64px;border-radius:50%;border:2px solid #dfff00;box-shadow:0 0 14px rgba(223,255,0,.5)}
#brand span{font-size:12px;opacity:.85}
#go:focus-visible,.ch:focus-visible,.tb:focus-visible{outline:3px solid #fff;outline-offset:2px}
#touch{display:none;width:min(100%,800px);justify-content:space-between;padding:0 8px;box-sizing:border-box}
.tb{width:clamp(46px,13vw,72px);height:60px;border-radius:12px;border:3px solid #fff;background:#443d85;color:#fff;font:inherit;font-size:20px;touch-action:none}
@media (pointer:coarse){#touch{display:flex}}
small{opacity:.7;font-size:9px}
#snd{right:52px}
#pb{right:auto;left:10px;display:none}
#pause{display:none;position:absolute;left:0;top:0;width:800px;height:400px;transform-origin:0 0;background:rgba(11,13,8,.88);flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:2;font-size:14px}
#pause h2{margin:0 0 8px;color:#dfff00;font-size:28px}
#pause button{width:240px;padding:12px;border-radius:6px;border:2px solid #dfff00;background:#0b0d08;color:#dfff00;font:inherit;font-size:13px;cursor:pointer}
#pause button:first-of-type{background:#dfff00;color:#0b0d08}
#pause button:hover{filter:brightness(1.2)}
#menu #me{position:absolute;left:22px;top:14px;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:1}
#me img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #dfff00;box-shadow:0 0 14px rgba(223,255,0,.5)}
#me span{font-size:8px;line-height:1.2;color:#fff;white-space:nowrap}
#me b{color:#dfff00;font-weight:normal}
</style>
</head>

function mk(ty,x,g){const D={walker:[30,36,1],hopper:[28,30,1],tank:[44,40,4],drone:[34,22,1],charger:[34,32,2]}[ty];
  return{ty,x,y:ty==='drone'?140:GY-D[1],w:D[0],h:D[1],hp:D[2],vx:ty==='tank'?.6:1,l:g?g[0]:0,r:g?g[1]-D[0]:LEVEL,y0:130+Math.random()*70,ph:Math.random()*6,hc:0,cw:60,cm:0,cdir:1,dead:0,sh:ty==='tank'||ty==='drone'||Math.random()<.4,st:Math.random()*100|0,cd:170};}
function shoot(){const d=p.face,x=p.x+p.w/2+d*p.w/2,y=p.y+p.h*.42,w=p.wp;
  const B=(vx,vy,o)=>pb.push(Object.assign({x,y,vx:vx*d,vy,d:.5,c:'#4cf0ff'},o));
  if(w==='blaster')B(9,0);
  else if(w==='spread')[-.3,0,.3].forEach(a=>B(8.5*Math.cos(a),8.5*Math.sin(a),{d:.4,c:'#ff9a2a'}));
  else if(w==='rapid')B(11,(Math.random()-.5)*1.4,{d:.3,c:'#ffe14a',s:.6});
  else if(w==='wave')B(6.5,0,{k:'w',y0:y,c:'#ff5fd0'});
  else if(w==='laser')B(15,0,{d:1,pierce:1,c:'#dfff00'});
  else B(5,-6,{g:.35,bomb:1,d:0,c:'#ff6a3a'});}
function boom(x,y){fx.push({x,y,t:12});sfx('stomp');
  for(const e of enemies)if(!e.dead&&Math.abs(e.x+e.w/2-x)<75&&Math.abs(e.y+e.h/2-y)<75){e.hp-=3;if(e.hp<=0){e.dead=1;score+=40;}}
  if(boss&&!boss.dead&&Math.abs(boss.x+boss.w/2-x)<boss.w/2+60&&Math.abs(boss.y+boss.h/2-y)<boss.h/2+60){boss.hp-=2;boss.fl=6;}}
const FRUITS=['🍎','🍌','🍇','🍓','🍉','🍍'];
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='square',v=.12,to=0,delay=0){if(muted)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02);}
const SFX={
  hover:()=>tone(700,.04,'square',.05),
  click:()=>{tone(520,.06,'square',.1);tone(780,.08,'square',.1,0,.05);},
  start:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.12,'square',.1,0,i*.07)),
  coin:()=>{tone(988,.07,'square',.08);tone(1319,.14,'square',.08,0,.06);},
  jump:()=>tone(280,.14,'square',.07,620),
  shoot:()=>tone(1000,.09,'sawtooth',.06,200),
  stomp:()=>tone(220,.12,'square',.1,70),
  hurt:()=>tone(260,.3,'sawtooth',.12,50),
  power:()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,.1,'square',.09,0,i*.06)),
  dash:()=>tone(400,.15,'sawtooth',.06,1200),
  pause:()=>tone(440,.08,'triangle',.1)
};
function sfx(n){try{SFX[n]();}catch(e){}}
// personaj seçəndə yalnız qısa düymə səsi (danışıq/robot səsi yoxdur)

function reset(full){
  if(full){score=0;lives=3;stage=0;}
  fruits=[];items=[420,1300,2150,3150,3800].map(x=>({x,y:GY-34,on:1}));spawnT=0;bullets=[];pb=[];fx=[];wmT=0;boss=null;arena=0;
  plats.forEach((q,i)=>{for(let k=0;k<Math.floor(q[2]/40);k++)fruits.push({x:q[0]+10+k*40,y:q[1]-32,f:FRUITS[(i+k)%6],on:1});});
  for(let x=200;x<4000;x+=260)if(ground.some(g=>x>g[0]&&x<g[1]-30))fruits.push({x,y:GY-40,f:FRUITS[(x/260|0)%6],on:1});
  enemies=[600,900,1500,2200,2600,3250,3600].map((x,i)=>{const g=ground.find(g=>x>g[0]&&x<g[1]),ty=STGR[stage][i%STGR[stage].length],e=mk(ty,x,g);if(g){e.l=Math.max(g[0],x-90);e.r=Math.min(g[1]-e.w,x+90);}e.st=i*30;return e;});
  spawn();
}
function spawn(){p={x:60,y:200,w:28,h:36,vx:0,vy:0,on:0,face:1,inv:0,big:0,dash:0,dcd:0,scd:0,wp:'blaster'};cam=0;if(arena){p.x=3450;cam=LEVEL-W;}}

const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;ac();
  if(!e.repeat){if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();else if(e.code==='Escape'&&(state==='win'||state==='over'))toMenu();}
    if(e.code==='KeyM')toggleMute();}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousedown',e=>{if(e.button===0&&state==='play')keys.Fire=1;});
addEventListener('mouseup',()=>keys.Fire=0);
[['bl','ArrowLeft'],['br','ArrowRight'],['bj','Space'],['bd','KeyX'],['bs','Fire'],['bdn','ArrowDown']].forEach(([id,k])=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});

  for(const f of fx){ctx.globalAlpha=f.t/12;ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.arc(f.x,f.y,(12-f.t)*6+8,0,7);ctx.fill();}ctx.globalAlpha=1;
  // oyunçu
  const dp=x=>{const sc=p.big?1.43:1,sy=p.cr?p.h/(p.big?52:36):1,sx=p.cr?1.15:1;ctx.save();ctx.translate(x+p.w/2,p.y+p.h);ctx.scale(sc*sx,sc*sy);drawChar(sel,-14,-36,p.face);ctx.restore();};
  if(p.dash>0){ctx.globalAlpha=.25;for(let k=3;k>=1;k--)dp(p.x-p.face*k*12);ctx.globalAlpha=1;}
  if(!(p.inv&&t%6<3))dp(p.x);
  ctx.restore();
  // HUD
  ctx.fillStyle='rgba(11,13,8,.8)';ctx.fillRect(8,8,440,30);
  ctx.fillStyle='#fff';ctx.font='12px "Press Start 2P",monospace';ctx.textBaseline='middle';
  ctx.fillText('VIBE '+score+'   ❤ '+lives+'   STG '+(stage+1)+(p.big?'   ⚡ DASH':''),18,24);
  ctx.fillStyle='rgba(11,13,8,.8)';ctx.fillRect(8,42,230,22);ctx.fillStyle='#dfff00';ctx.font='10px "Press Start 2P",monospace';ctx.textBaseline='middle';ctx.fillText('GUN: '+WEAP[p.wp].n,16,54);
  if(wmT>0){ctx.font='16px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillText(wmsg,W/2,90);ctx.textAlign='left';}
  if(boss&&!boss.dead){ctx.fillStyle='rgba(11,13,8,.85)';ctx.fillRect(W-312,8,304,30);ctx.fillStyle='#555';ctx.fillRect(W-304,22,288,10);ctx.fillStyle='#ff3b3b';ctx.fillRect(W-304,22,288*Math.max(0,boss.hp)/boss.max,10);ctx.fillStyle='#fff';ctx.font='9px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillText(BOSSN[stage],W-304,12);}
}

function banner(txt,sub){
  ctx.fillStyle='rgba(11,13,8,.85)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#dfff00';ctx.font='32px "Press Start 2P",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt,W/2,150);
  ctx.fillStyle='#fff';ctx.font='14px "Press Start 2P",monospace';
  ctx.fillText('Score: '+score,W/2,210);ctx.fillText(sub,W/2,260);ctx.textAlign='left';
}

let last=0,acc=0,mt=0;
function pauseGame(){if(state!=='play')return;state='pause';keys.Fire=0;pauseEl.style.display='flex';sfx('pause');}
function resumeGame(){state='play';pauseEl.style.display='none';acc=0;}
function toMenu(){try{speechSynthesis.cancel();}catch(e){}reset(true);state='menu';pauseEl.style.display='none';pauseBtn.style.display='none';menu.style.display='flex';}
function nextStage(){stage++;if(stage>=3){state='win';return;}reset(false);state='play';}
let hov=-1;
const mg=document.getElementById('mbg').getContext('2d');
const CAN=Array.from({length:16},(_,i)=>({x:i*50+8,h:30+Math.random()*90,up:Math.random()<.7,ph:Math.random()*6}));
const SP=Array.from({length:40},()=>({x:Math.random()*800,y:Math.random()*400,s:.3+Math.random()*.8}));
function drawBg(){
  mg.fillStyle='#0b0d08';mg.fillRect(0,0,800,400);
  const gr=mg.createRadialGradient(400,340,20,400,340,430);gr.addColorStop(0,'rgba(190,255,0,.2)');gr.addColorStop(1,'rgba(190,255,0,0)');
  mg.fillStyle=gr;mg.fillRect(0,0,800,400);
  for(const c of CAN){const h=c.h+Math.sin(mt/40+c.ph)*12,y=400-h-20;
    mg.fillStyle=c.up?'rgba(60,220,90,.25)':'rgba(255,80,80,.2)';mg.fillRect(c.x,y,18,h);mg.fillRect(c.x+8,y-14,2,h+28);}
  mg.fillStyle='#dfff00';
  for(const s of SP){s.y-=s.s;if(s.y<-4){s.y=404;s.x=Math.random()*800;}mg.globalAlpha=.3+.5*Math.abs(Math.sin(mt/20+s.x));mg.fillRect(s.x,s.y,3,3);}
  mg.globalAlpha=1;
  const fx=722,fy=18;
  mg.fillStyle='#3a3a30';mg.fillRect(fx-3,fy-4,5,150);
  for(let i=0;i<64;i+=2){const o=Math.sin(mt/9+i/8)*4*(i/64);
    mg.fillStyle=i%8<4?'#d6ff1a':'#c4ee00';mg.fillRect(fx+2+i,fy+o,2,44);
    mg.fillStyle='rgba(0,0,0,.16)';mg.fillRect(fx+2+i,fy+o+32,2,12);}
  mg.fillStyle='#0b0d08';mg.font='bold 14px "Press Start 2P",monospace';mg.textBaseline='alphabetic';
  mg.fillText('v/v',fx+14,fy+28+Math.sin(mt/9+3)*1.5);
}
function drawMenu(){drawBg();
  document.querySelectorAll('.pt').forEach((m,i)=>{const g=m.getContext('2d');g.clearRect(0,0,80,90);
    const act=i===sel||i===hov;
    CA.blink=(mt+i*53)%210<6;CA.wave=act?Math.sin(mt/4):null;
    const hop=i===sel?Math.max(0,Math.sin(mt/12))*9:0,bob=Math.sin(mt/20+i)*1.2,sw=54-hop*1.2;
    g.fillStyle='rgba(0,0,0,.4)';g.fillRect(40-sw/2,85,sw,4);
    drawChar(i,10,8+bob-hop,1,28,36,g,2.1);});
  CA.blink=0;CA.wave=null;}
function loop(ts){
  if(!last)last=ts;const dt=Math.min(ts-last,100);acc+=dt;last=ts;
  if(state==='play'){
    while(acc>=16.667){update();acc-=16.667;if(state!=='play')break;}
    draw();
  }else{
    acc=0;draw();
    if(state==='menu'){mt++;drawMenu();}
    else if(state==='clear'){banner('STAGE '+(stage+1)+' CLEAR!','Next stage...');clearT-=dt;if(clearT<=0)nextStage();}
    else if(state==='win'){banner('YOU WIN!','Space: replay · Esc: menu');if(keys.Space)start();}
    else if(state==='over'){banner('GAME OVER','Space: retry · Esc: menu');if(keys.Space)start();}
  }
  requestAnimationFrame(loop);
}

// Menyu
const chDiv=document.getElementById('chars'),menu=document.getElementById('menu');
CHARS.forEach((c,i)=>{
  const b=document.createElement('button');b.className='ch'+(i===0?' sel':'');
  const m=document.createElement('canvas');m.width=80;m.height=90;m.className='pt';
  
  b.appendChild(m);b.appendChild(document.createElement('br'));b.append(c.name);
  b.onmouseenter=()=>{hov=i;sfx('hover');};b.onmouseleave=()=>hov=-1;b.onclick=()=>{sel=i;voice(i);[...chDiv.children].forEach((x,j)=>x.classList.toggle('sel',j===i));};
  chDiv.appendChild(b);
});
function start(){reset(true);state='play';menu.style.display='none';pauseEl.style.display='none';pauseBtn.style.display='block';keys.Space=0;}
document.getElementById('go').onclick=()=>{sfx('start');start();};document.getElementById('go').onmouseenter=()=>sfx('hover');
const wrapEl=document.getElementById('wrap'),pauseEl=document.getElementById('pause'),pauseBtn=document.getElementById('pb'),snd=document.getElementById('snd');
function fit(){const sc='scale('+wrapEl.clientWidth/800+')';menu.style.transform=sc;pauseEl.style.transform=sc;}
addEventListener('resize',fit);document.addEventListener('fullscreenchange',()=>setTimeout(fit,60));fit();
const fs=document.getElementById('fs');if(!document.fullscreenEnabled)fs.style.display='none';
fs.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();});
fs.onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
[pauseBtn,snd].forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();}));
pauseBtn.onclick=()=>pauseGame();snd.onclick=toggleMute;
document.getElementById('resume').onclick=()=>{sfx('click');resumeGame();};
document.getElementById('restart').onclick=()=>{sfx('click');start();};
document.getElementById('tomenu').onclick=()=>{sfx('click');toMenu();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
reset(true);draw();requestAnimationFrame(loop);
</script>
